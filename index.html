<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Task Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="app-header">
    <h1>Task Tracker</h1>
    <nav class="nav-tabs">
      <button id="nav-all-tasks" class="nav-btn active">All Tasks</button>
      <button id="nav-add-task" class="nav-btn">Add Task</button>
    </nav>
  </header>

  <main class="container">

    <!-- Stretch Goal: Task Summary Bar -->
    <section id="summary-bar" class="summary-card">
      <div class="summary-item">Total: <span id="count-total">0</span></div>
      <div class="summary-item badge-todo">To Do: <span id="count-todo">0</span></div>
      <div class="summary-item badge-in-progress">In Progress: <span id="count-in-progress">0</span></div>
      <div class="summary-item badge-done">Done: <span id="count-done">0</span></div>
    </section>

    <!-- VIEW 1: All Tasks Board & Filtering -->
    <section id="view-task-list" class="view-section">
      
      <!-- Filter & Search Controls -->
      <div class="controls-card">
        <div class="search-box">
          <input type="text" id="search-title" placeholder="Search tasks by title...">
        </div>
        <div class="filter-box">
          <label for="filter-status">Status:</label>
          <select id="filter-status">
            <option value="All">All</option>
            <option value="To Do">To Do</option>
            <option value="In Progress">In Progress</option>
            <option value="Done">Done</option>
          </select>

          <label for="filter-assignee">Assignee:</label>
          <select id="filter-assignee">
            <option value="All">All Assignees</option>
            <!-- Member 4 will populate this dynamically or keep options standard -->
          </select>
        </div>
      </div>

      <!-- Task Items Container -->
      <div id="tasks-container" class="task-grid">
        <!-- Dynamic Task Cards will be rendered here by Member 3 -->
      </div>
    </section>

    <!-- VIEW 2: Add Task Form (Hidden by default) -->
    <section id="view-add-task" class="view-section hidden">
      <div class="form-card">
        <h2>Create New Task</h2>
        
        <!-- Error Message Display Area -->
        <div id="form-error" class="error-banner hidden"></div>

        <form id="task-form" novalidate>
          <div class="form-group">
            <label for="task-title">Task Title <span class="required">*</span></label>
            <input type="text" id="task-title" placeholder="e.g., Design Landing Page" required>
          </div>

          <div class="form-group">
            <label for="task-assignee">Assignee Name</label>
            <input type="text" id="task-assignee" placeholder="e.g., Sarah">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="task-priority">Priority</label>
              <select id="task-priority">
                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
              </select>
            </div>

            <div class="form-group">
              <label for="task-due-date">Due Date <span class="required">*</span></label>
              <input type="date" id="task-due-date" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary">Save Task</button>
        </form>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
